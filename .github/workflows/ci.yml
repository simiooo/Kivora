name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Flow (headless dispatcher acceptance)
        run: node scripts/launch.mjs --flow
        timeout-minutes: 5

      - name: Smoke (launch, screenshot, quit)
        run: node scripts/launch.mjs --smoke
        timeout-minutes: 5

      - name: Shots (all screens)
        run: node scripts/launch.mjs --shots
        timeout-minutes: 5

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            artifacts/smoke.png
            artifacts/shot-*.png
          if-no-files-found: ignore

  package:
    # 只在打 tag 或手动触发时出安装包，避免每次 push 都跑一遍 3 分钟的打包
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build installer
        run: pnpm dist
        timeout-minutes: 15

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kivora-windows
          path: release/*.exe
          if-no-files-found: error
