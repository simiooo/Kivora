name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke (launch, screenshot, quit)
        run: pnpm smoke
        timeout-minutes: 5

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: artifacts/smoke.png
          if-no-files-found: ignore
